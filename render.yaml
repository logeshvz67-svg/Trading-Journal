# Render Blueprint: one free web service that serves both the API and the built React app.
services:
  - type: web
    name: market-quest
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Optional (Phase 4). The app works fully without it.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AI_DAILY_LIMIT
        value: "20"
      - key: AI_MAX_TOKENS
        value: "800"
